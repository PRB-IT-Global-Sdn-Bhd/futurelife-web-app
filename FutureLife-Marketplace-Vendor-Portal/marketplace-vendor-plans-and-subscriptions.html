  <script>
    (() => {
      const flows = ['sponsored-listing', 'plan-change'];
      const states = ['processing', 'success', 'failed', 'cancelled', 'expired'];
      const query = new URLSearchParams(window.location.search);
      const flow = flows.includes(query.get('flow')) ? query.get('flow') : 'sponsored-listing';
      const state = states.includes(query.get('state')) ? query.get('state') : 'processing';
      const template = document.querySelector(`template[data-flow="${flow}"][data-state="${state}"]`);
      const sidebar = document.getElementById(flow === 'sponsored-listing' ? 'sidebar-sponsored-listing' : 'sidebar-billing');
      document.body.insertBefore(sidebar.content.cloneNode(true), document.querySelector('.page-shell'));
      const main = document.getElementById('checkout-result');
      main.id = template.dataset.mainId;
      main.appendChild(template.content.cloneNode(true));
      document.title = template.dataset.title;
      document.querySelector('meta[name="description"]').setAttribute('content', template.dataset.description);
      document.querySelectorAll('template').forEach((node) => node.remove());
    })();
  </script>

  <script>
    const filterButtons = document.querySelectorAll('.filter');
    const entries = document.querySelectorAll('.earnings-table tbody tr, .earning-card');
    const cards = document.querySelectorAll('.earning-card');
    const search = document.getElementById('list-search');
    const emptyState = document.getElementById('empty-state');
    const validFilters = {"status": ["all", "paid", "pending", "failed", "cancelled", "expired", "refunded", "disputed"], "type": ["all", "plan", "sponsored"]};
    const activeFilters = {};
    const requested = new URLSearchParams(window.location.search);
    Object.keys(validFilters).forEach((group) => { const value = requested.get(group); activeFilters[group] = validFilters[group].includes(value) ? value : 'all'; });
    search.value = requested.get('q') || '';

    function updateEntries() {
      const query = search.value.trim().toLowerCase();
      entries.forEach((entry) => {
        const groupMatch = Object.keys(activeFilters).every((group) => activeFilters[group] === 'all' || entry.dataset[group] === activeFilters[group]);
        entry.hidden = !(groupMatch && entry.dataset.search.includes(query));
      });
      emptyState.classList.toggle('visible', [...cards].every((card) => card.hidden));
      filterButtons.forEach((button) => {
        const selected = activeFilters[button.dataset.group] === button.dataset.filter;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
    }

    function syncUrl() {
      const url = new URL(window.location.href);
      Object.keys(activeFilters).forEach((group) => { if (activeFilters[group] === 'all') url.searchParams.delete(group); else url.searchParams.set(group, activeFilters[group]); });
      if (search.value.trim()) url.searchParams.set('q', search.value.trim());
      else url.searchParams.delete('q');
      window.history.replaceState({}, '', `${url.pathname}${url.search}`);
    }

    filterButtons.forEach((button) => button.addEventListener('click', () => { activeFilters[button.dataset.group] = button.dataset.filter; updateEntries(); syncUrl(); }));
    search.addEventListener('input', () => { updateEntries(); syncUrl(); });
    updateEntries();
  </script>
  
</template>
