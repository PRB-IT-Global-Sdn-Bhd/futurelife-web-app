<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sponsored Listings: one page, with ?tab=purchase|checkout (default purchase). Each tab keeps its own ?step= / ?state= / ?flow= preview states. -->
  <template id="head-purchase">
  <meta name="description" content="FutureLife Marketplace Vendor Sponsor Listing preview" />
  <title>Marketplace Vendor Portal — Sponsor Listing</title>
  <script>
    (() => {
      const view = new URLSearchParams(window.location.search).get('step') === 'review' ? 'review' : 'choose';
      if (view === 'review') document.documentElement.dataset.step = 'review';
      document.title = view === 'review' ? 'Marketplace Vendor Portal — Review Sponsored Listing Payment' : 'Marketplace Vendor Portal — Sponsor Listing';
    })();
  </script>
  <link rel="stylesheet" href="vendor-portal.css" />
  <link rel="stylesheet" href="vendor-portal-flow.css" />
  <style>
    /* One page, two views: ?step=choose (default) and ?step=review. */
    html[data-step="review"] #sponsor-listing, html:not([data-step="review"]) #sponsored-payment {
      display: none;
    }
  </style>
  <link rel="stylesheet" href="vendor-portal-navigation.css" />
</template>
  <template id="head-checkout">
  <meta name="description" content="FutureLife Marketplace Vendor checkout result preview" />
  <title>Marketplace Vendor Portal — Checkout Result</title>
  <link rel="stylesheet" href="vendor-portal.css" />
  <link rel="stylesheet" href="vendor-portal-flow.css" />
  <link rel="stylesheet" href="vendor-portal-navigation.css" />
</template>
  <script>(function(){var k=["purchase", "checkout"],t=new URLSearchParams(location.search).get('tab');if(k.indexOf(t)<0)t=k[0];document.documentElement.setAttribute('data-tab',t);document.write(document.getElementById('head-'+t).innerHTML);})();</script>
</head>
<body>
  <template id="body-purchase" data-body-attrs="">
  <aside class="sidebar" aria-label="Vendor portal navigation">
    <a class="portal-name" href="#dashboard">Marketplace Vendor Portal</a>
    <a class="account-row" href="#profile"><span class="avatar">KE</span><span><strong>Kampus Essentials</strong><span>Vendor account</span></span></a>
    <section class="side-section"><p class="side-label">Vendor portal</p><nav class="side-menu" aria-label="Vendor portal pages"><a href="#dashboard">Dashboard</a><a href="#listings">Listings</a><a href="#orders">Orders</a><a href="#payouts">Payouts</a><a href="#messages">Messages <span class="menu-count">3</span></a><a href="#profile">Profile</a></nav></section>
    <a class="side-logout" href="#logout">Logout</a>
  </aside>

  <div class="page-shell">
    <header class="topbar"><div class="topbar-label"><strong>Marketplace Vendor</strong> Portal</div></header>
    <header class="mobile-header"><span class="mobile-portal">Marketplace Vendor Portal</span><span class="mobile-account">Kampus Essentials</span></header>

    <main class="content" id="sponsor-listing">
      <div class="heading">
        <div><p class="eyebrow">Marketplace listings</p><h1>Sponsor Listing</h1><p class="page-copy">Choose an approved sponsorship option for this live listing. Sponsorship prices and terms must be configured by FutureLife.</p></div>
        <a class="button secondary back-link" href="marketplace-vendor-listings.html">Back to Listings</a>
      </div>

      <section class="card" aria-labelledby="listing-heading">
        <div class="card-heading"><div><h2 id="listing-heading">Selected listing</h2><p>Only an eligible live listing should enter this payment flow.</p></div><span class="status">{{LISTING_STATUS}}</span></div>
        <div class="listing-reference"><div><span class="listing-name">{{LISTING_TITLE}}</span><span class="listing-meta">{{LISTING_CATEGORY}} · RM {{LISTING_PRICE}}</span></div><div><span class="label">Listing reference</span><span class="value">{{LISTING_ID}}</span></div></div>
      </section>

      <div class="flow-layout">
        <section class="card" aria-labelledby="sponsorship-heading">
          <div class="card-heading"><div><h2 id="sponsorship-heading">Choose sponsorship</h2><p>Select only options currently configured and available for this listing.</p></div></div>
          <form id="sponsorship-form" novalidate>
            <div class="form-grid">
              <div class="form-field full"><label for="placement">Placement</label><select id="placement" name="placement" required><option value="{{SPONSORED_PLACEMENT_ID}}">{{SPONSORED_PLACEMENT_NAME}}</option></select><p class="help">Placement availability is determined by the FutureLife Marketplace configuration.</p></div>
              <div class="form-field full"><label>Duration and price</label><div class="duration-grid" role="radiogroup" aria-label="Sponsored listing duration and fee">
                <label class="duration-option"><input type="radio" name="sponsorship-option" value="{{SPONSORED_OPTION_ID_1}}" data-label="{{SPONSORED_OPTION_LABEL_1}}" data-duration="{{SPONSORED_OPTION_DURATION_1}}" data-fee="{{SPONSORED_OPTION_FEE_1}}" checked /><strong>{{SPONSORED_OPTION_LABEL_1}}</strong><span>{{SPONSORED_OPTION_DURATION_1}}</span><em>RM {{SPONSORED_OPTION_FEE_1}}</em></label>
                <label class="duration-option"><input type="radio" name="sponsorship-option" value="{{SPONSORED_OPTION_ID_2}}" data-label="{{SPONSORED_OPTION_LABEL_2}}" data-duration="{{SPONSORED_OPTION_DURATION_2}}" data-fee="{{SPONSORED_OPTION_FEE_2}}" /><strong>{{SPONSORED_OPTION_LABEL_2}}</strong><span>{{SPONSORED_OPTION_DURATION_2}}</span><em>RM {{SPONSORED_OPTION_FEE_2}}</em></label>
                <label class="duration-option"><input type="radio" name="sponsorship-option" value="{{SPONSORED_OPTION_ID_3}}" data-label="{{SPONSORED_OPTION_LABEL_3}}" data-duration="{{SPONSORED_OPTION_DURATION_3}}" data-fee="{{SPONSORED_OPTION_FEE_3}}" /><strong>{{SPONSORED_OPTION_LABEL_3}}</strong><span>{{SPONSORED_OPTION_DURATION_3}}</span><em>RM {{SPONSORED_OPTION_FEE_3}}</em></label>
              </div></div>
            </div>
            <div class="action-row"><a class="button secondary" href="marketplace-vendor-create-listing.html?mode=edit&amp;listing={{LISTING_ID}}">View Listing</a><button class="button" type="submit">Continue to Payment</button></div>
            <p class="feedback" id="selection-feedback" role="alert"></p>
          </form>
        </section>

        <aside class="summary-card" aria-labelledby="summary-heading"><h2 id="summary-heading">Sponsorship summary</h2><ul class="summary-list"><li><span>Listing</span><span>{{LISTING_TITLE}}</span></li><li><span>Option</span><span id="summary-option">{{SPONSORED_OPTION_LABEL_1}}</span></li><li><span>Duration</span><span id="summary-duration">{{SPONSORED_OPTION_DURATION_1}}</span></li><li class="total"><span>Total payable</span><span id="summary-fee">RM {{SPONSORED_OPTION_FEE_1}}</span></li></ul></aside>
      </div>

      <aside class="notice"><strong>Payment rule:</strong> Do not mark a listing as sponsored from this page. In the live Bubble workflow, FutureLife should activate a sponsored status only after a verified Stripe webhook confirms payment.</aside>
    </main>

    <main class="content" id="sponsored-payment">
      <div class="payment-shell">
        <div class="payment-header"><p class="eyebrow">Marketplace listings</p><h1>Review Sponsored Listing Payment</h1><p class="page-copy">Confirm the configured sponsorship selection before opening Stripe Checkout.</p></div>
        <section class="payment-summary" aria-labelledby="payment-summary-heading">
          <div class="payment-title" id="payment-summary-heading">Payment summary</div>
          <ul class="summary-list"><li><span>Listing</span><span>{{LISTING_TITLE}}</span></li><li><span>Listing reference</span><span>{{LISTING_ID}}</span></li><li><span>Sponsorship option</span><span>{{SPONSORED_OPTION_LABEL}}</span></li><li><span>Duration</span><span>{{SPONSORED_OPTION_DURATION}}</span></li><li><span>Placement</span><span>{{SPONSORED_PLACEMENT_NAME}}</span></li><li><span>Sponsored listing price</span><span>RM {{SPONSORED_OPTION_FEE}}</span></li><li><span>Tax</span><span>RM {{TAX_AMOUNT}}</span></li><li class="total"><span>Total payable</span><span>RM {{TOTAL_PAYABLE}}</span></li></ul>
        </section>
        <section class="payment-method" aria-labelledby="payment-method-heading"><h2 id="payment-method-heading">Payment</h2><p>This preview opens no real checkout. In production, create a Stripe Checkout Session in MYR and supply the payment result through a verified FutureLife server-side webhook.</p><span class="stripe-label">Secure payment by Stripe</span></section>
        <form id="payment-form" novalidate><label class="confirm-check"><input id="payment-confirmation" type="checkbox" /><span>I confirm that the listing and configured sponsorship option above are correct. I understand that sponsorship must not be activated until payment is verified.</span></label><p class="feedback" id="payment-feedback" role="alert"></p><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listings.html?step=choose&amp;listing={{LISTING_ID}}">Back to Selection</a><button class="button" type="submit">Open Stripe Checkout</button></div></form>
        <aside class="notice warning"><strong>Preview-only payment action:</strong> the button demonstrates the post-payment route only. In Bubble, redirect the vendor to Stripe Checkout; use the verified webhook—not the return URL—to create the payment record and activate sponsorship.</aside>
      </div>
    </main>
  </div>

  <script>
    if (document.documentElement.dataset.step !== 'review') {
      const root = document.getElementById('sponsor-listing');
      const options = [...root.querySelectorAll('input[name="sponsorship-option"]')];
      const optionField = document.getElementById('summary-option');
      const durationField = document.getElementById('summary-duration');
      const feeField = document.getElementById('summary-fee');
      const form = document.getElementById('sponsorship-form');
      const feedback = document.getElementById('selection-feedback');
      function syncSummary(input) { optionField.textContent = input.dataset.label; durationField.textContent = input.dataset.duration; feeField.textContent = `RM ${input.dataset.fee}`; }
      options.forEach((input) => input.addEventListener('change', () => syncSummary(input)));
      form.addEventListener('submit', (event) => { event.preventDefault(); const selected = options.find((input) => input.checked); if (!selected) { feedback.textContent = 'Select a configured sponsorship option before continuing.'; feedback.classList.add('visible'); return; } const params = new URLSearchParams(window.location.search); params.set('listing', params.get('listing') || '{{LISTING_ID}}'); params.set('option', selected.value); params.delete('step'); window.location.href = `marketplace-vendor-sponsored-listings.html?step=review&${params.toString()}`; });
    }
  </script>
  <script>
    if (document.documentElement.dataset.step === 'review') {
      const root = document.getElementById('sponsored-payment');
      document.getElementById('payment-form').addEventListener('submit', (event) => { event.preventDefault(); const checkbox = document.getElementById('payment-confirmation'); const feedback = document.getElementById('payment-feedback'); if (!checkbox.checked) { feedback.textContent = 'Confirm the sponsorship details before continuing to payment.'; feedback.classList.add('visible'); return; } const params = new URLSearchParams(window.location.search); params.delete('step'); params.set('listing', params.get('listing') || '{{LISTING_ID}}'); params.set('option', params.get('option') || '{{SPONSORED_OPTION_ID}}'); params.set('payment', '{{PAYMENT_ID}}'); params.set('preview', 'verified'); window.location.href = `marketplace-vendor-sponsored-listings.html?tab=checkout&flow=sponsored-listing&state=processing&${params.toString()}`; });
    }
  </script>
  
</template>
  <template id="body-checkout" data-body-attrs="">
  <!-- One checkout return page for sponsored listings and plan changes.
       Use ?flow=sponsored-listing|plan-change&state=processing|success|failed|cancelled|expired.
       In production the server renders the state from the verified Stripe webhook record; the URL never grants an outcome. -->
  <template id="sidebar-sponsored-listing"><aside class="sidebar" aria-label="Vendor portal navigation"><a class="portal-name" href="#dashboard">Marketplace Vendor Portal</a><a class="account-row" href="#profile"><span class="avatar">KE</span><span><strong>Kampus Essentials</strong><span>Vendor account</span></span></a><section class="side-section"><p class="side-label">Vendor portal</p><nav class="side-menu" aria-label="Vendor portal pages"><a href="#dashboard">Dashboard</a><a href="#listings">Listings</a><a href="#orders">Orders</a><a href="#payouts">Payouts</a><a href="#messages">Messages <span class="menu-count">3</span></a><a href="#profile">Profile</a></nav></section><a class="side-logout" href="#logout">Logout</a></aside></template>
  <template id="sidebar-billing"><aside class="sidebar" aria-label="Vendor portal navigation"><a class="portal-name" href="#dashboard">Marketplace Vendor Portal</a><a class="account-row" href="#profile"><span class="avatar">KE</span><span><strong>Kampus Essentials</strong><span>Vendor account</span></span></a><section class="side-section"><p class="side-label">Vendor portal</p><nav class="side-menu" aria-label="Vendor portal pages"><a href="#dashboard">Dashboard</a><a href="#listings">Listings</a><a href="#orders">Orders</a><a class="billing-parent" href="marketplace-vendor-plans-and-subscriptions.html">Billing</a><a class="billing-sub-link active" href="marketplace-vendor-plans-and-subscriptions.html" aria-current="page">Plans &amp; Subscriptions</a><a class="billing-sub-link" href="marketplace-vendor-sponsored-listings.html">Sponsored Listings</a><a href="marketplace-vendor-payouts.html">Payouts</a><a href="#messages">Messages <span class="menu-count">3</span></a><a href="#profile">Profile</a></nav></section><a class="side-logout" href="#logout">Logout</a></aside></template>
  <template data-flow="sponsored-listing" data-state="processing" data-main-id="sponsored-listing-processing" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Confirming" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-processing preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="processing-heading"><div class="result-marker pending processing" aria-hidden="true">…</div><p class="eyebrow">Sponsored listing payment</p><h1 id="processing-heading">Confirming Payment</h1><p class="page-copy" role="status">You have returned from Stripe Checkout. FutureLife is waiting for verified payment confirmation before sponsorship starts. Refresh status to check again.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button" href="marketplace-vendor-sponsored-listings.html?tab=checkout&flow=sponsored-listing&amp;state=processing&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Refresh Status</a></div><p class="preview-routes"><span class="preview-tag">Preview routes</span><a class="text-link" href="marketplace-vendor-sponsored-listings.html?tab=checkout&flow=sponsored-listing&amp;state=success&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Server confirmed: Payment Confirmed</a><a class="text-link" href="marketplace-vendor-sponsored-listings.html?tab=checkout&flow=sponsored-listing&amp;state=failed&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Server result: Not Completed</a></p><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice warning"><strong>Live implementation:</strong> keep this state while the FutureLife payment record is <code>Pending</code>. Show the confirmed page only after the Stripe webhook validates the event and the server records the payment once. The return URL alone is not payment verification, so this page must not start sponsorship.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="success" data-main-id="sponsored-payment-success" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Confirmed" data-description="FutureLife Marketplace Vendor Sponsored Listing payment-success preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="success-heading"><div class="result-marker" aria-hidden="true">✓</div><p class="eyebrow">Sponsored listing payment</p><h1 id="success-heading">Payment Confirmed</h1><p class="page-copy">This preview represents the state shown only after FutureLife receives verified payment confirmation from Stripe.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount paid</span><strong>RM {{TOTAL_PAID}}</strong></div><div><span>Sponsorship status</span><strong>{{SPONSORED_STATUS}}</strong></div><div><span>Sponsorship start</span><strong>{{SPONSORED_START_DATE}}</strong></div><div><span>Sponsorship end</span><strong>{{SPONSORED_END_DATE}}</strong></div><div><span>Invoice reference</span><strong>{{INVOICE_ID}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button secondary" href="marketplace-vendor-create-listing.html?mode=edit&amp;listing={{LISTING_ID}}">View Listing</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html#plans-and-subscription">View Billing</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice"><strong>Live implementation:</strong> render this confirmation only after the Stripe webhook validates the event and updates the FutureLife payment record to <code>Paid</code>. The return URL alone is not payment verification.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="failed" data-main-id="sponsored-payment-failed" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Not Completed" data-description="FutureLife Marketplace Vendor Sponsored Listing payment-failed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="failed-heading"><div class="result-marker failed" aria-hidden="true">×</div><p class="eyebrow">Sponsored listing payment</p><h1 id="failed-heading">Payment Not Completed</h1><p class="page-copy">The listing remains unchanged and is not sponsored. Use the payment provider result returned to FutureLife to show the appropriate retry state.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listings.html?listing={{LISTING_ID}}">Change Selection</a><a class="button" href="marketplace-vendor-sponsored-listings.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Retry Payment</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice failure"><strong>Do not activate sponsorship:</strong> a failure, cancellation, or unfinished checkout must leave the listing in its previous non-sponsored state. The live error message should come from FutureLife or Stripe, not a hard-coded decline reason.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="cancelled" data-main-id="sponsored-listing-cancelled" data-title="Marketplace Vendor Portal — Sponsored Listing Checkout Cancelled" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-cancelled preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="cancelled-heading"><div class="result-marker neutral" aria-hidden="true">–</div><p class="eyebrow">Sponsored listing payment</p><h1 id="cancelled-heading">Checkout Cancelled</h1><p class="page-copy">You left Stripe Checkout before paying. Nothing was charged. The listing remains unchanged and is not sponsored.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listings.html?listing={{LISTING_ID}}">Change Selection</a><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button" href="marketplace-vendor-sponsored-listings.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Return to Review</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice"><strong>Cancelled is not a failed payment:</strong> show this state when Stripe returns the vendor through the cancel URL and FutureLife has no paid event for the checkout. Do not start sponsorship; the vendor can review the details and open a new checkout.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="expired" data-main-id="sponsored-listing-expired" data-title="Marketplace Vendor Portal — Sponsored Listing Checkout Expired" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-expired preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="expired-heading"><div class="result-marker pending" aria-hidden="true">!</div><p class="eyebrow">Sponsored listing payment</p><h1 id="expired-heading">Checkout Expired</h1><p class="page-copy">The Stripe Checkout session timed out before payment was completed. Nothing was charged. The listing remains unchanged and is not sponsored. Start a new checkout to continue.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div><div><span>Session expired</span><strong>{{CHECKOUT_EXPIRED_AT}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listings.html?listing={{LISTING_ID}}">Change Selection</a><a class="button" href="marketplace-vendor-sponsored-listings.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Start New Checkout</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice warning"><strong>Start a new session:</strong> when the Stripe <code>checkout.session.expired</code> event is verified, mark the checkout as expired and keep sponsorship unchanged. Recalculate the MYR amount on the FutureLife server and create a new Checkout Session; do not reuse the expired session.</aside></div></template>
  
  
  
  
  
  <template data-flow="plan-change" data-state="processing" data-main-id="plan-change-processing" data-title="Marketplace Vendor Portal — Plan Change Payment Confirming" data-description="FutureLife Marketplace Vendor Plan Change checkout-processing preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="processing-heading"><div class="result-marker pending processing" aria-hidden="true">…</div><p class="eyebrow">Marketplace plan change</p><h1 id="processing-heading">Confirming Plan Change</h1><p class="page-copy" role="status">You have returned from Stripe Checkout. FutureLife is waiting for verified payment confirmation before the plan change takes effect. Refresh status to check again.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html#plans-and-subscription">Back to Billing</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html?tab=checkout&flow=plan-change&amp;state=processing&amp;change={{PLAN_CHANGE_ID}}">Refresh Status</a></div><p class="preview-routes"><span class="preview-tag">Preview routes</span><a class="text-link" href="marketplace-vendor-plans-and-subscriptions.html?tab=checkout&flow=plan-change&amp;state=success&amp;change={{PLAN_CHANGE_ID}}">Server confirmed: Plan Change Confirmed</a><a class="text-link" href="marketplace-vendor-plans-and-subscriptions.html?tab=checkout&flow=plan-change&amp;state=failed&amp;change={{PLAN_CHANGE_ID}}">Server result: Not Completed</a></p><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice warning"><strong>Live implementation:</strong> keep this state while the FutureLife payment record is <code>Pending</code>. Show the confirmed page only after the Stripe webhook validates the event and the server records the payment once. The return URL alone is not payment verification, so this page must not change the plan or listing allowance.</aside></div></template>
  <template data-flow="plan-change" data-state="success" data-main-id="marketplace-plan-change-success" data-title="Marketplace Vendor Portal — Plan Change Confirmed" data-description="FutureLife Marketplace Vendor plan-change confirmed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="success-heading"><div class="result-marker" aria-hidden="true">✓</div><p class="eyebrow">Marketplace plan change</p><h1 id="success-heading">Plan Change Confirmed</h1><p class="page-copy">This state should be rendered only from the FutureLife server after it confirms the validated plan-change intent and, where payment was required, the verified Stripe webhook event.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>New plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change status</span><strong>{{PLAN_CHANGE_STATUS}}</strong></div><div><span>Effective date</span><strong>{{PLAN_CHANGE_EFFECTIVE_DATE}}</strong></div><div><span>Updated listing allowance</span><strong>{{TARGET_LISTING_LIMIT}} active listings</strong></div><div><span>Next renewal date</span><strong>{{NEXT_PLAN_RENEWAL_DATE}}</strong></div><div><span>Amount paid today</span><strong>RM {{TOTAL_PAID}}</strong></div><div><span>Payment / invoice reference</span><strong>{{PAYMENT_OR_INVOICE_REFERENCE}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html#plans-and-subscription">Back to Billing</a><a class="button secondary" href="marketplace-vendor-listings.html">View Listings</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html?tab=change">Manage Plan</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice"><strong>Server-side rule:</strong> write the plan change, billing transaction, invoice, and any scheduled downgrade exactly once. A successful browser return alone must not activate or modify the vendor’s plan.</aside></div></template>
  <template data-flow="plan-change" data-state="failed" data-main-id="marketplace-plan-change-failed" data-title="Marketplace Vendor Portal — Plan Change Not Completed" data-description="FutureLife Marketplace Vendor plan-change not-completed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="failed-heading"><div class="result-marker failed" aria-hidden="true">×</div><p class="eyebrow">Marketplace plan change</p><h1 id="failed-heading">Plan Change Not Completed</h1><p class="page-copy">The current plan and listing allowance remain unchanged. Use the server or payment-provider result to show the appropriate recovery state.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Plan-change status</span><strong>{{PLAN_CHANGE_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html?tab=change">Change Plan</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html?tab=review&change={{PLAN_CHANGE_ID}}">Retry Plan Change</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice failure"><strong>Keep entitlements unchanged:</strong> a failed, cancelled, expired, or incomplete payment must not change the plan or listing allowance. Do not show a hard-coded decline reason; use the provider/server-returned status.</aside></div></template>
  <template data-flow="plan-change" data-state="cancelled" data-main-id="plan-change-cancelled" data-title="Marketplace Vendor Portal — Plan Change Checkout Cancelled" data-description="FutureLife Marketplace Vendor Plan Change checkout-cancelled preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="cancelled-heading"><div class="result-marker neutral" aria-hidden="true">–</div><p class="eyebrow">Marketplace plan change</p><h1 id="cancelled-heading">Checkout Cancelled</h1><p class="page-copy">You left Stripe Checkout before paying. Nothing was charged. The current plan and listing allowance remain unchanged.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html?tab=change">Change Plan</a><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html#plans-and-subscription">Back to Billing</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html?tab=review&change={{PLAN_CHANGE_ID}}">Return to Review</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice"><strong>Cancelled is not a failed payment:</strong> show this state when Stripe returns the vendor through the cancel URL and FutureLife has no paid event for the checkout. Do not change the plan or listing allowance; the vendor can review the details and   <template data-flow="plan-change" data-state="expired" data-main-id="plan-change-expired" data-title="Marketplace Vendor Portal — Plan Change Checkout Expired" data-description="FutureLife Marketplace Vendor Plan Change checkout-expired preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="expired-heading"><div class="result-marker pending" aria-hidden="true">!</div><p class="eyebrow">Marketplace plan change</p><h1 id="expired-heading">Checkout Expired</h1><p class="page-copy">The Stripe Checkout session timed out before payment was completed. Nothing was charged. The current plan and listing allowance remain unchanged. Start a new checkout to continue.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div><div><span>Session expired</span><strong>{{CHECKOUT_EXPIRED_AT}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plans-and-subscriptions.html?tab=change">Change Plan</a><a class="button" href="marketplace-vendor-plans-and-subscriptions.html?tab=review&change={{PLAN_CHANGE_ID}}">Start New Checkout</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice warning"><strong>Start a new session:</strong> when the Stripe <code>checkout.session.expired</code> event is verified, mark the checkout as expired and keep the plan change unchanged. Recalculate the MYR amount on the FutureLife server and create a new Checkout Session; do not reuse the expired session.</aside></div></template>

  <script>
    (() => {
      const flows = ['sponsored-listing', 'plan-change'];
      const states = ['processing', 'success', 'failed', 'cancelled', 'expired'];
      const query = new URLSearchParams(window.location.search);
      const flow = flows.includes(query.get('flow')) ? query.get('flow') : 'sponsored-listing';
      const state = states.includes(query.get('state')) ? query.get('state') : 'processing';
      const template = document.querySelector(`template[data-flow="${flow}"][data-state="${state}"]`);
      const sidebar = document.getElementById(flow === 'sponsored-listing' ? 'sidebar-sponsored-listing' : 'sidebar-billing');
      document.body.insertBefore(sidebar.content.cloneNode(true), document.querySelector('.page-shell'));
      const main = document.getElementById('checkout-result');
      main.id = template.dataset.mainId;
      main.appendChild(template.content.cloneNode(true));
      document.title = template.dataset.title;
      document.querySelector('meta[name="description"]').setAttribute('content', template.dataset.description);
      document.querySelectorAll('template').forEach((node) => node.remove());
    })();
  </script>
  
</template>
