  <template id="sidebar-billing"><aside class="sidebar" aria-label="Vendor portal navigation"><a class="portal-name" href="#dashboard">Marketplace Vendor Portal</a><a class="account-row" href="#profile"><span class="avatar">KE</span><span><strong>Kampus Essentials</strong><span>Vendor account</span></span></a><section class="side-section"><p class="side-label">Vendor portal</p><nav class="side-menu" aria-label="Vendor portal pages"><a href="#dashboard">Dashboard</a><a href="#listings">Listings</a><a href="#orders">Orders</a><a class="billing-parent" href="marketplace-vendor-billing.html">Billing</a><a class="billing-sub-link active" href="marketplace-vendor-billing.html#plans-and-fees">Plans &amp; Sponsored Listing Fees</a><a class="billing-sub-link" href="marketplace-vendor-payouts.html">Platform Fees</a><a href="#messages">Messages <span class="menu-count">3</span></a><a href="#profile">Profile</a></nav></section><a class="side-logout" href="#logout">Logout</a></aside></template>
  <template data-flow="sponsored-listing" data-state="processing" data-main-id="sponsored-listing-processing" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Confirming" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-processing preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="processing-heading"><div class="result-marker pending processing" aria-hidden="true">…</div><p class="eyebrow">Sponsored listing payment</p><h1 id="processing-heading">Confirming Payment</h1><p class="page-copy" role="status">You have returned from Stripe Checkout. FutureLife is waiting for verified payment confirmation before sponsorship starts. Refresh status to check again.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button" href="marketplace-vendor-checkout-result.html?flow=sponsored-listing&amp;state=processing&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Refresh Status</a></div><p class="preview-routes"><span class="preview-tag">Preview routes</span><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=sponsored-listing&amp;state=success&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Server confirmed: Payment Confirmed</a><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=sponsored-listing&amp;state=failed&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Server result: Not Completed</a></p><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice warning"><strong>Live implementation:</strong> keep this state while the FutureLife payment record is <code>Pending</code>. Show the confirmed page only after the Stripe webhook validates the event and the server records the payment once. The return URL alone is not payment verification, so this page must not start sponsorship.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="success" data-main-id="sponsored-payment-success" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Confirmed" data-description="FutureLife Marketplace Vendor Sponsored Listing payment-success preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="success-heading"><div class="result-marker" aria-hidden="true">✓</div><p class="eyebrow">Sponsored listing payment</p><h1 id="success-heading">Payment Confirmed</h1><p class="page-copy">This preview represents the state shown only after FutureLife receives verified payment confirmation from Stripe.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount paid</span><strong>RM {{TOTAL_PAID}}</strong></div><div><span>Sponsorship status</span><strong>{{SPONSORED_STATUS}}</strong></div><div><span>Sponsorship start</span><strong>{{SPONSORED_START_DATE}}</strong></div><div><span>Sponsorship end</span><strong>{{SPONSORED_END_DATE}}</strong></div><div><span>Invoice reference</span><strong>{{INVOICE_ID}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button secondary" href="marketplace-vendor-create-listing.html?mode=edit&amp;listing={{LISTING_ID}}">View Listing</a><a class="button" href="marketplace-vendor-billing.html#plans-and-fees">View Billing</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice"><strong>Live implementation:</strong> render this confirmation only after the Stripe webhook validates the event and updates the FutureLife payment record to <code>Paid</code>. The return URL alone is not payment verification.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="failed" data-main-id="sponsored-payment-failed" data-title="Marketplace Vendor Portal — Sponsored Listing Payment Not Completed" data-description="FutureLife Marketplace Vendor Sponsored Listing payment-failed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="failed-heading"><div class="result-marker failed" aria-hidden="true">×</div><p class="eyebrow">Sponsored listing payment</p><h1 id="failed-heading">Payment Not Completed</h1><p class="page-copy">The listing remains unchanged and is not sponsored. Use the payment provider result returned to FutureLife to show the appropriate retry state.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listing.html?listing={{LISTING_ID}}">Change Selection</a><a class="button" href="marketplace-vendor-sponsored-listing.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Retry Payment</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice failure"><strong>Do not activate sponsorship:</strong> a failure, cancellation, or unfinished checkout must leave the listing in its previous non-sponsored state. The live error message should come from FutureLife or Stripe, not a hard-coded decline reason.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="cancelled" data-main-id="sponsored-listing-cancelled" data-title="Marketplace Vendor Portal — Sponsored Listing Checkout Cancelled" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-cancelled preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="cancelled-heading"><div class="result-marker neutral" aria-hidden="true">–</div><p class="eyebrow">Sponsored listing payment</p><h1 id="cancelled-heading">Checkout Cancelled</h1><p class="page-copy">You left Stripe Checkout before paying. Nothing was charged. The listing remains unchanged and is not sponsored.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listing.html?listing={{LISTING_ID}}">Change Selection</a><a class="button secondary" href="marketplace-vendor-listings.html">Back to Listings</a><a class="button" href="marketplace-vendor-sponsored-listing.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Return to Review</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice"><strong>Cancelled is not a failed payment:</strong> show this state when Stripe returns the vendor through the cancel URL and FutureLife has no paid event for the checkout. Do not start sponsorship; the vendor can review the details and open a new checkout.</aside></div></template>
  <template data-flow="sponsored-listing" data-state="expired" data-main-id="sponsored-listing-expired" data-title="Marketplace Vendor Portal — Sponsored Listing Checkout Expired" data-description="FutureLife Marketplace Vendor Sponsored Listing checkout-expired preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="expired-heading"><div class="result-marker pending" aria-hidden="true">!</div><p class="eyebrow">Sponsored listing payment</p><h1 id="expired-heading">Checkout Expired</h1><p class="page-copy">The Stripe Checkout session timed out before payment was completed. Nothing was charged. The listing remains unchanged and is not sponsored. Start a new checkout to continue.</p><div class="result-details"><div><span>Listing</span><strong>{{LISTING_TITLE}}</strong></div><div><span>Listing reference</span><strong>{{LISTING_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div><div><span>Session expired</span><strong>{{CHECKOUT_EXPIRED_AT}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-sponsored-listing.html?listing={{LISTING_ID}}">Change Selection</a><a class="button" href="marketplace-vendor-sponsored-listing.html?step=review&amp;listing={{LISTING_ID}}&amp;option={{SPONSORED_OPTION_ID}}">Start New Checkout</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=sponsored-listing">Message FutureLife Support</a></section><aside class="notice warning"><strong>Start a new session:</strong> when the Stripe <code>checkout.session.expired</code> event is verified, mark the checkout as expired and keep sponsorship unchanged. Recalculate the MYR amount on the FutureLife server and create a new Checkout Session; do not reuse the expired session.</aside></div></template>
  <template data-flow="listing-credits" data-state="processing" data-main-id="listing-credits-processing" data-title="Marketplace Vendor Portal — Listing Credits Payment Confirming" data-description="FutureLife Marketplace Vendor Listing Credits checkout-processing preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="processing-heading"><div class="result-marker pending processing" aria-hidden="true">…</div><p class="eyebrow">Listing credits payment</p><h1 id="processing-heading">Confirming Payment</h1><p class="page-copy" role="status">You have returned from Stripe Checkout. FutureLife is waiting for verified payment confirmation before listing credits are added. Refresh status to check again.</p><div class="result-details"><div><span>Credit package</span><strong>{{CREDIT_PACKAGE_LABEL}}</strong></div><div><span>Credits requested</span><strong>{{CREDITS_PURCHASED}}</strong></div><div><span>Current credit balance</span><strong>{{LISTING_CREDIT_BALANCE}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button" href="marketplace-vendor-checkout-result.html?flow=listing-credits&amp;state=processing&amp;package={{CREDIT_PACKAGE_ID}}">Refresh Status</a></div><p class="preview-routes"><span class="preview-tag">Preview routes</span><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=listing-credits&amp;state=success&amp;package={{CREDIT_PACKAGE_ID}}">Server confirmed: Payment Confirmed</a><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=listing-credits&amp;state=failed&amp;package={{CREDIT_PACKAGE_ID}}">Server result: Not Completed</a></p><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=listing-credits">Message FutureLife Support</a></section><aside class="notice warning"><strong>Live implementation:</strong> keep this state while the FutureLife payment record is <code>Pending</code>. Show the confirmed page only after the Stripe webhook validates the event and the server records the payment once. The return URL alone is not payment verification, so this page must not add listing credits.</aside></div></template>
  <template data-flow="listing-credits" data-state="success" data-main-id="listing-credits-success" data-title="Marketplace Vendor Portal — Listing Credits Payment Confirmed" data-description="FutureLife Marketplace Vendor Listing Credits payment-success preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="success-heading"><div class="result-marker" aria-hidden="true">✓</div><p class="eyebrow">Listing credits payment</p><h1 id="success-heading">Payment Confirmed</h1><p class="page-copy">This preview represents the state shown only after FutureLife receives verified payment confirmation from Stripe and records the credit transaction.</p><div class="result-details"><div><span>Credit package</span><strong>{{CREDIT_PACKAGE_LABEL}}</strong></div><div><span>Credits added</span><strong>{{CREDITS_PURCHASED}}</strong></div><div><span>Updated credit balance</span><strong>{{UPDATED_LISTING_CREDIT_BALANCE}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount paid</span><strong>RM {{TOTAL_PAID}}</strong></div><div><span>Invoice reference</span><strong>{{INVOICE_ID}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button secondary" href="marketplace-vendor-listings.html">View Listings</a><a class="button" href="marketplace-vendor-create-listing.html">Create New Listing</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=listing-credits">Message FutureLife Support</a></section><aside class="notice"><strong>Live implementation:</strong> update <code>{{UPDATED_LISTING_CREDIT_BALANCE}}</code> only after the Stripe webhook validates the payment and the credit transaction has been written once. Do not award credits from the browser return URL.</aside></div></template>
  <template data-flow="listing-credits" data-state="failed" data-main-id="listing-credits-failed" data-title="Marketplace Vendor Portal — Listing Credits Payment Not Completed" data-description="FutureLife Marketplace Vendor Listing Credits payment-failed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="failed-heading"><div class="result-marker failed" aria-hidden="true">×</div><p class="eyebrow">Listing credits payment</p><h1 id="failed-heading">Payment Not Completed</h1><p class="page-copy">No listing credits have been added to the vendor account. Use the payment provider result returned to FutureLife to provide the appropriate retry state.</p><div class="result-details"><div><span>Credit package</span><strong>{{CREDIT_PACKAGE_LABEL}}</strong></div><div><span>Credits requested</span><strong>{{CREDITS_PURCHASED}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listing-credits.html">Change Package</a><a class="button" href="marketplace-vendor-listing-credits.html?step=review&amp;package={{CREDIT_PACKAGE_ID}}">Retry Payment</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=listing-credits">Message FutureLife Support</a></section><aside class="notice failure"><strong>Do not add credits:</strong> a failed, cancelled, or unfinished checkout must leave the current credit balance unchanged. The live failure message should come from FutureLife or Stripe, not a hard-coded payment-decline reason.</aside></div></template>
  <template data-flow="listing-credits" data-state="cancelled" data-main-id="listing-credits-cancelled" data-title="Marketplace Vendor Portal — Listing Credits Checkout Cancelled" data-description="FutureLife Marketplace Vendor Listing Credits checkout-cancelled preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="cancelled-heading"><div class="result-marker neutral" aria-hidden="true">–</div><p class="eyebrow">Listing credits payment</p><h1 id="cancelled-heading">Checkout Cancelled</h1><p class="page-copy">You left Stripe Checkout before paying. Nothing was charged. No listing credits have been added and the current credit balance is unchanged.</p><div class="result-details"><div><span>Credit package</span><strong>{{CREDIT_PACKAGE_LABEL}}</strong></div><div><span>Credits requested</span><strong>{{CREDITS_PURCHASED}}</strong></div><div><span>Current credit balance</span><strong>{{LISTING_CREDIT_BALANCE}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listing-credits.html">Change Package</a><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button" href="marketplace-vendor-listing-credits.html?step=review&amp;package={{CREDIT_PACKAGE_ID}}">Return to Review</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=listing-credits">Message FutureLife Support</a></section><aside class="notice"><strong>Cancelled is not a failed payment:</strong> show this state when Stripe returns the vendor through the cancel URL and FutureLife has no paid event for the checkout. Do not add listing credits; the vendor can review the details and open a new checkout.</aside></div></template>
  <template data-flow="listing-credits" data-state="expired" data-main-id="listing-credits-expired" data-title="Marketplace Vendor Portal — Listing Credits Checkout Expired" data-description="FutureLife Marketplace Vendor Listing Credits checkout-expired preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="expired-heading"><div class="result-marker pending" aria-hidden="true">!</div><p class="eyebrow">Listing credits payment</p><h1 id="expired-heading">Checkout Expired</h1><p class="page-copy">The Stripe Checkout session timed out before payment was completed. Nothing was charged. No listing credits have been added and the current credit balance is unchanged. Start a new checkout to continue.</p><div class="result-details"><div><span>Credit package</span><strong>{{CREDIT_PACKAGE_LABEL}}</strong></div><div><span>Credits requested</span><strong>{{CREDITS_PURCHASED}}</strong></div><div><span>Current credit balance</span><strong>{{LISTING_CREDIT_BALANCE}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_PAYABLE}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div><div><span>Session expired</span><strong>{{CHECKOUT_EXPIRED_AT}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-listing-credits.html">Change Package</a><a class="button" href="marketplace-vendor-listing-credits.html?step=review&amp;package={{CREDIT_PACKAGE_ID}}">Start New Checkout</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=listing-credits">Message FutureLife Support</a></section><aside class="notice warning"><strong>Start a new session:</strong> when the Stripe <code>checkout.session.expired</code> event is verified, mark the checkout as expired and keep listing credits unchanged. Recalculate the MYR amount on the FutureLife server and create a new Checkout Session; do not reuse the expired session.</aside></div></template>
  <template data-flow="plan-change" data-state="processing" data-main-id="plan-change-processing" data-title="Marketplace Vendor Portal — Plan Change Payment Confirming" data-description="FutureLife Marketplace Vendor Plan Change checkout-processing preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="processing-heading"><div class="result-marker pending processing" aria-hidden="true">…</div><p class="eyebrow">Marketplace plan change</p><h1 id="processing-heading">Confirming Plan Change</h1><p class="page-copy" role="status">You have returned from Stripe Checkout. FutureLife is waiting for verified payment confirmation before the plan change takes effect. Refresh status to check again.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Payment reference</span><strong>{{PAYMENT_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Payment status</span><strong>{{PAYMENT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button" href="marketplace-vendor-checkout-result.html?flow=plan-change&amp;state=processing&amp;change={{PLAN_CHANGE_ID}}">Refresh Status</a></div><p class="preview-routes"><span class="preview-tag">Preview routes</span><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=plan-change&amp;state=success&amp;change={{PLAN_CHANGE_ID}}">Server confirmed: Plan Change Confirmed</a><a class="text-link" href="marketplace-vendor-checkout-result.html?flow=plan-change&amp;state=failed&amp;change={{PLAN_CHANGE_ID}}">Server result: Not Completed</a></p><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice warning"><strong>Live implementation:</strong> keep this state while the FutureLife payment record is <code>Pending</code>. Show the confirmed page only after the Stripe webhook validates the event and the server records the payment once. The return URL alone is not payment verification, so this page must not change the plan or listing allowance.</aside></div></template>
  <template data-flow="plan-change" data-state="success" data-main-id="marketplace-plan-change-success" data-title="Marketplace Vendor Portal — Plan Change Confirmed" data-description="FutureLife Marketplace Vendor plan-change confirmed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="success-heading"><div class="result-marker" aria-hidden="true">✓</div><p class="eyebrow">Marketplace plan change</p><h1 id="success-heading">Plan Change Confirmed</h1><p class="page-copy">This state should be rendered only from the FutureLife server after it confirms the validated plan-change intent and, where payment was required, the verified Stripe webhook event.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>New plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change status</span><strong>{{PLAN_CHANGE_STATUS}}</strong></div><div><span>Effective date</span><strong>{{PLAN_CHANGE_EFFECTIVE_DATE}}</strong></div><div><span>Updated listing allowance</span><strong>{{TARGET_LISTING_LIMIT}} active listings</strong></div><div><span>Next renewal date</span><strong>{{NEXT_PLAN_RENEWAL_DATE}}</strong></div><div><span>Amount paid today</span><strong>RM {{TOTAL_PAID}}</strong></div><div><span>Payment / invoice reference</span><strong>{{PAYMENT_OR_INVOICE_REFERENCE}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button secondary" href="marketplace-vendor-listings.html">View Listings</a><a class="button" href="marketplace-vendor-plan-change.html">Manage Plan</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice"><strong>Server-side rule:</strong> write the plan change, billing transaction, invoice, and any scheduled downgrade exactly once. A successful browser return alone must not activate or modify the vendor’s plan.</aside></div></template>
  <template data-flow="plan-change" data-state="failed" data-main-id="marketplace-plan-change-failed" data-title="Marketplace Vendor Portal — Plan Change Not Completed" data-description="FutureLife Marketplace Vendor plan-change not-completed preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="failed-heading"><div class="result-marker failed" aria-hidden="true">×</div><p class="eyebrow">Marketplace plan change</p><h1 id="failed-heading">Plan Change Not Completed</h1><p class="page-copy">The current plan and listing allowance remain unchanged. Use the server or payment-provider result to show the appropriate recovery state.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Plan-change status</span><strong>{{PLAN_CHANGE_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plan-change.html">Change Plan</a><a class="button" href="marketplace-vendor-plan-change-review.html?change={{PLAN_CHANGE_ID}}">Retry Plan Change</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice failure"><strong>Keep entitlements unchanged:</strong> a failed, cancelled, expired, or incomplete payment must not change the plan or listing allowance. Do not show a hard-coded decline reason; use the provider/server-returned status.</aside></div></template>
  <template data-flow="plan-change" data-state="cancelled" data-main-id="plan-change-cancelled" data-title="Marketplace Vendor Portal — Plan Change Checkout Cancelled" data-description="FutureLife Marketplace Vendor Plan Change checkout-cancelled preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="cancelled-heading"><div class="result-marker neutral" aria-hidden="true">–</div><p class="eyebrow">Marketplace plan change</p><h1 id="cancelled-heading">Checkout Cancelled</h1><p class="page-copy">You left Stripe Checkout before paying. Nothing was charged. The current plan and listing allowance remain unchanged.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plan-change.html">Change Plan</a><a class="button secondary" href="marketplace-vendor-billing.html#plans-and-fees">Back to Billing</a><a class="button" href="marketplace-vendor-plan-change-review.html?change={{PLAN_CHANGE_ID}}">Return to Review</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice"><strong>Cancelled is not a failed payment:</strong> show this state when Stripe returns the vendor through the cancel URL and FutureLife has no paid event for the checkout. Do not change the plan or listing allowance; the vendor can review the details and open a new checkout.</aside></div></template>
  <template data-flow="plan-change" data-state="expired" data-main-id="plan-change-expired" data-title="Marketplace Vendor Portal — Plan Change Checkout Expired" data-description="FutureLife Marketplace Vendor Plan Change checkout-expired preview"><div class="payment-shell"><section class="result-panel" aria-labelledby="expired-heading"><div class="result-marker pending" aria-hidden="true">!</div><p class="eyebrow">Marketplace plan change</p><h1 id="expired-heading">Checkout Expired</h1><p class="page-copy">The Stripe Checkout session timed out before payment was completed. Nothing was charged. The current plan and listing allowance remain unchanged. Start a new checkout to continue.</p><div class="result-details"><div><span>Current plan</span><strong>{{CURRENT_MARKETPLACE_PLAN}}</strong></div><div><span>Requested plan</span><strong>{{TARGET_MARKETPLACE_PLAN}}</strong></div><div><span>Plan-change reference</span><strong>{{PLAN_CHANGE_ID}}</strong></div><div><span>Checkout reference</span><strong>{{CHECKOUT_SESSION_ID}}</strong></div><div><span>Amount to pay</span><strong>RM {{TOTAL_DUE_TODAY}}</strong></div><div><span>Checkout status</span><strong>{{CHECKOUT_STATUS}}</strong></div><div><span>Session expired</span><strong>{{CHECKOUT_EXPIRED_AT}}</strong></div></div><div class="action-row"><a class="button secondary" href="marketplace-vendor-plan-change.html">Change Plan</a><a class="button" href="marketplace-vendor-plan-change-review.html?change={{PLAN_CHANGE_ID}}">Start New Checkout</a></div><a class="text-link" href="marketplace-vendor-messages.html?conversation=futurelife-support&amp;compose=1&amp;context=plan-change">Message FutureLife Support</a></section><aside class="notice warning"><strong>Start a new session:</strong> when the Stripe <code>checkout.session.expired</code> event is verified, mark the checkout as expired and keep the plan change unchanged. Recalculate the MYR amount on the FutureLife server and create a new Checkout Session; do not reuse the expired session.</aside></div></template>
  <div class="page-shell">
    <header class="topbar"><div class="topbar-label"><strong>Marketplace Vendor</strong> Portal</div></header>
    <header class="mobile-header"><span class="mobile-portal">Marketplace Vendor Portal</span><span class="mobile-account">Kampus Essentials</span></header>
    <main class="content" id="checkout-result"></main>
  </div>
  <script>
    (() => {
      const flows = ['sponsored-listing', 'listing-credits', 'plan-change'];
      const states = ['processing', 'success', 'failed', 'cancelled', 'expired'];
      const query = new URLSearchParams(window.location.search);
      const flow = flows.includes(query.get('flow')) ? query.get('flow') : 'sponsored-listing';
      const state = states.includes(query.get('state')) ? query.get('state') : 'processing';
      const template = document.querySelector(`template[data-flow="${flow}"][data-state="${state}"]`);
      const sidebar = document.getElementById(flow === 'sponsored-listing' ? 'sidebar-sponsored-listing' : 'sidebar-billing');
      document.body.insertBefore(sidebar.content.cloneNode(true), document.querySelector('.page-shell'));
      const main = document.getElementById('checkout-result');
      main.id = template.dataset.mainId;
      main.appendChild(template.content.cloneNode(true));
      document.title = template.dataset.title;
      document.querySelector('meta[name="description"]').setAttribute('content', template.dataset.description);
      document.querySelectorAll('template').forEach((node) => node.remove());
    })();
  </script>
  <script src="vendor-portal-navigation.js"></script>
</body>
</html>
