<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Marketplace Vendor Portal — Redirecting</title>
  <script>
    /* marketplace-vendor-checkout-result.html was folded into Plans & Subscriptions (plan changes) or Sponsored Listings (sponsored payments). Old links are forwarded to the matching page and tab;
       other query parameters and the hash are kept. */
    (function () {
      var params = new URLSearchParams(window.location.search), out = new URLSearchParams();
      var tab = 'checkout', page = params.get('flow') === 'sponsored-listing' ? 'marketplace-vendor-sponsored-listings.html' : 'marketplace-vendor-plans-and-subscriptions.html';
      if (tab) out.set('tab', tab);
      params.forEach(function (v, k) { if (k !== 'tab') out.append(k, v); });
      var query = out.toString();
      window.location.replace(page + (query ? '?' + query : '') + window.location.hash);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="marketplace-vendor-plans-and-subscriptions.html">Open Plans &amp; Subscriptions (plan changes) or Sponsored Listings (sponsored payments)</a></p></noscript>
</body>
</html>
