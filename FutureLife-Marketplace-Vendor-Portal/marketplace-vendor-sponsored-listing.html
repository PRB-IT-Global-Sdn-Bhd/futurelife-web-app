<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Marketplace Vendor Portal — Redirecting</title>
  <script>
    /* marketplace-vendor-sponsored-listing.html was folded into Sponsored Listings. Old links are forwarded to the matching page and tab;
       other query parameters and the hash are kept. */
    (function () {
      var params = new URLSearchParams(window.location.search), out = new URLSearchParams();
      var tab = null, page = 'marketplace-vendor-sponsored-listings.html';
      if (tab) out.set('tab', tab);
      params.forEach(function (v, k) { if (k !== 'tab') out.append(k, v); });
      var query = out.toString();
      window.location.replace(page + (query ? '?' + query : '') + window.location.hash);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="marketplace-vendor-sponsored-listings.html">Open Sponsored Listings</a></p></noscript>
</body>
</html>
