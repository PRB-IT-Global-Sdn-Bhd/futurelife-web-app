name: Portals CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portals/**"
      - ".github/workflows/portals-ci.yml"
      - "apps/portals/vercel.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portals/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
