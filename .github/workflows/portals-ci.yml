name: Portals CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/portals/**"
      - ".github/workflows/portals-ci.yml"
      - "vercel.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portals/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  preview-note:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Remind about Vercel preview
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### Preview deploy (Phase 0)

            - **Vercel:** Connect this repository with root directory \`apps/portals\` (or use repo-root \`vercel.json\`). Each PR should get a preview URL on the Vercel bot comment.
            - **UI shell:** Open \`/shell\` on the preview (layout check at **1440×900** and **390×844**).
            - **GitHub Pages:** Static prototypes at repo root are unchanged; Pages is not replaced by this workflow.

            _CI verified typecheck, lint, and build only._`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });