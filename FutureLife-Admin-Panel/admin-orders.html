<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FutureLife Admin — Redirecting</title>
  <script>
    /* admin-orders.html was merged into admin-orders-and-payouts.html in the 21-page lean admin panel.
       Old links are forwarded to the matching tab; other query parameters and the hash are kept. */
    (function () {
      var params = new URLSearchParams(window.location.search), force = {"tab": "orders"}, dflt = {}, ren = {};
      Object.keys(ren).forEach(function (k) { if (params.has(k)) { params.set(ren[k], params.get(k)); params.delete(k); } });
      Object.keys(force).forEach(function (k) { params.set(k, force[k]); });
      Object.keys(dflt).forEach(function (k) { if (!params.has(k)) params.set(k, dflt[k]); });
      var query = params.toString();
      window.location.replace('admin-orders-and-payouts.html' + (query ? '?' + query : '') + window.location.hash);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="admin-orders-and-payouts.html">Open Orders &amp; Payouts</a></p></noscript>
</body>
</html>
