<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Rentals Vendor Portal — Redirecting</title>
  <script>
    /* The Rentals Vendor Portal is now split into one page per screen.
       Old single-page links (?view=...) are forwarded to the matching page; other query
       parameters and the hash are kept. Unknown or missing views open the dashboard. */
    (function () {
      var map = {"dashboard":"rentals-vendor-dashboard.html","properties":"rentals-vendor-properties.html","create-property":"rentals-vendor-create-property.html","availability":"rentals-vendor-availability.html","applications":"rentals-vendor-applications.html","application-details":"rentals-vendor-application-details.html","tenancies":"rentals-vendor-tenancies.html","tenancy-details":"rentals-vendor-tenancy-details.html","move-in-checklist":"rentals-vendor-move-in-checklist.html","tenancy-end-renewal":"rentals-vendor-tenancy-end-renewal.html","messages":"rentals-vendor-messages.html","billing":"rentals-vendor-billing-plans.html","billing-plans":"rentals-vendor-billing-plans.html","rental-commissions":"rentals-vendor-billing-plans.html","notifications":"rentals-vendor-notifications.html","profile":"rentals-vendor-profile.html","security":"rentals-vendor-account-security.html","login":"rentals-vendor-signin.html","signup":"rentals-vendor-signup.html"};
      var params = new URLSearchParams(window.location.search);
      var view = params.get('view');
      var target = map[view] || map.dashboard;
      params.delete('view');
      var query = params.toString();
      var hash = window.location.hash;
      if (!hash && view === 'billing-plans') hash = '#plans-and-subscription';
      window.location.replace(target + (query ? '?' + query : '') + hash);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="rentals-vendor-dashboard.html">Open the Rentals Vendor Portal</a></p></noscript>
</body>
</html>
