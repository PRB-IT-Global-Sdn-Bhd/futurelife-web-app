<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FutureLife Jobs Vendor Portal employer sign-up preview" />
  <title>Jobs Vendor Portal — Create Employer Account</title>
  <link rel="stylesheet" href="vendor-portal-auth.css" />
  <style>
    button, input, select {
      font: inherit;
    }
    .eyebrow { margin: 0 0 7px; color: #62a719; font-size: 10px; font-weight: 700; letter-spacing: .45px; text-align: center; text-transform: uppercase; }
    .signin-link { text-decoration: none; }
    .signup-area {
      width: 270px;
      margin-top: 57px;
    }
    .field {
      margin: 0 0 14px;
    }
    input, select {
      display: block;
      width: 100%;
      height: 29px;
      border: 1px solid var(--border);
      border-radius: 0;
      outline: none;
      padding: 0 8px;
      background: var(--white);
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
    }
    select {
      appearance: auto;
    }
    input:focus, select:focus {
      border-color: var(--futurelife-green);
      box-shadow: 0 0 0 1px rgba(120, 190, 33, 0.14);
    }
    .agreement {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 3px 0 15px;
      color: #454545;
      font-size: 9px;
      line-height: 1.35;
    }
    .agreement input {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      margin: 0;
      padding: 0;
      accent-color: var(--futurelife-green);
    }
    .signup-button {
      display: block;
      width: 100%;
      height: 26px;
      border: 0;
      border-radius: 0;
      background: var(--futurelife-green);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      line-height: 26px;
      text-align: center;
      transition: background 160ms ease-out, transform 160ms ease-out;
    }
    .signup-button:hover {
      background: #6fae1e;
    }
    .signup-button:active {
      transform: scale(0.98);
    }
    .signin-copy {
      margin: 31px 0 0;
      color: #252525;
      font-size: 10px;
      line-height: 1.25;
    }
    .signin-link {
      margin-left: 7px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--futurelife-green);
      font-family: Arial, Helvetica, sans-serif;
      font-size: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .signin-link:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    @media (max-width:560px) {
      .signup-area {
        width: calc(100% - 40px);
        max-width: 335px;
        margin-top: 52px;
      }
      .field {
        margin-bottom: 18px;
      }
      input, select {
        height: 43px;
        padding-inline: 10px;
        font-size: 13px;
      }
      .agreement {
        gap: 8px;
        margin: 4px 0 18px;
        font-size: 11px;
      }
      .agreement input {
        width: 15px;
        height: 15px;
      }
      .signup-button {
        height: 46px;
        font-size: 13px;
        line-height: 46px;
      }
      .signin-copy {
        margin-top: 29px;
        font-size: 12px;
      }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after {
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">Future Life</div>

    <section class="signup-area" aria-label="Employer sign up">
      <p class="eyebrow">Jobs Vendor Portal</p>
      <h1>Create Employer Account</h1>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="employer-name">Full Name</label>
          <input id="employer-name" name="name" type="text" autocomplete="name" placeholder="Enter full name" required />
        </div>
        <div class="field">
          <label for="organisation-name">Organisation Name</label>
          <input id="organisation-name" name="organisation" type="text" autocomplete="organization" placeholder="Enter registered organisation name" required />
        </div>
        <div class="field">
          <label for="employer-email">Work Email Address</label>
          <input id="employer-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required />
        </div>
        <div class="field">
          <label for="employer-password">Create Password</label>
          <input id="employer-password" name="password" type="password" autocomplete="new-password" placeholder="Create password" minlength="8" required />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm password" minlength="8" required />
        </div>
        <label class="agreement"><input type="checkbox" required /><span>I agree to the FutureLife Jobs Employer Terms and the Candidate Data Privacy Notice.</span></label>
        <button class="signup-button" type="submit">Sign Up</button>
        <p class="notice" aria-live="polite"></p>
      </form>
      <p class="signin-copy">Already an Employer?<a class="signin-link" href="jobs-vendor-signin.html">Login</a></p>
    </section>
  </main>

  <script>
    const signupForm = document.getElementById('signup-form');
    const signupNotice = document.querySelector('.notice');
    const signupPassword = document.getElementById('employer-password');
    const confirmPassword = document.getElementById('confirm-password');
    signupForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!signupForm.checkValidity()) { signupNotice.textContent = 'Complete all required account details before creating the preview account.'; signupForm.reportValidity(); return; }
      if (signupPassword.value !== confirmPassword.value) { signupNotice.textContent = 'The password and confirmation must match.'; confirmPassword.focus(); return; }
      window.location.href = 'jobs-vendor-verify-email.html?state=sent';
    });
  </script>
  <script src="vendor-portal-navigation.js"></script>
</body>
</html>
