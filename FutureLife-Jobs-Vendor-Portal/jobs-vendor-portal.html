<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Jobs Vendor Portal — Redirecting</title>
  <script>
    /* The Jobs Vendor Portal is now split into one page per screen.
       Old single-page links (?view=...) are forwarded to the matching page; other query
       parameters and the hash are kept. Unknown or missing views open the dashboard. */
    (function () {
      var map = {"dashboard":["jobs-vendor-dashboard.html",""],"job-listings":["jobs-vendor-job-listings.html",""],"create-job":["jobs-vendor-create-job.html",""],"candidates":["jobs-vendor-candidates.html",""],"candidate-details":["jobs-vendor-candidate-details.html",""],"interviews":["jobs-vendor-interviews.html",""],"interview-details":["jobs-vendor-interview-details.html",""],"hires":["jobs-vendor-hires.html",""],"placement-details":["jobs-vendor-placement-details.html",""],"messages":["jobs-vendor-messages.html",""],"billing-plans":["jobs-vendor-billing-plans.html",""],"placement-fees":["jobs-vendor-billing-plans.html",""],"notifications":["jobs-vendor-notifications.html",""],"company-profile":["jobs-vendor-company-profile.html",""],"account-security":["jobs-vendor-account-security.html",""],"login":["jobs-vendor-signin.html",""],"billing":["jobs-vendor-billing-plans.html",""],"new-hire-checklist":["jobs-vendor-placement-details.html","checklist"],"close-placement":["jobs-vendor-placement-details.html","close"]};
      var params = new URLSearchParams(window.location.search);
      var target = map[params.get('view')] || map.dashboard;
      params.delete('view');
      if (target[1]) params.set('view', target[1]);
      var query = params.toString();
      var hash = window.location.hash;
      if (!hash && params.get('view') === null && (new URLSearchParams(window.location.search).get('view') === 'billing-plans')) hash = '#plans-and-fees';
      window.location.replace(target[0] + (query ? '?' + query : '') + hash);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="jobs-vendor-dashboard.html">Open the Jobs Vendor Portal</a></p></noscript>
</body>
</html>
